name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to Homebrew
        required: true
        type: string

permissions:
  contents: read

jobs:
  homebrew-template:
    if: github.event_name == 'push'
    uses: ./.github/workflows/homebrew-template.yml

  source:
    name: Source release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Package source
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="fs-lint-${version}-source"
          mkdir release
          git archive --format=tar.gz --prefix="$package/" -o "release/$package.tar.gz" "$GITHUB_SHA"
          cd release
          cmake -E sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fs-lint-source
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  build:
    name: ${{ matrix.asset_os }}-${{ matrix.asset_arch }} release
    if: github.event_name == 'push'
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_os: darwin
            asset_arch: arm64
            runner: macos-latest
          - asset_os: darwin
            asset_arch: amd64
            runner: macos-15-intel
          - asset_os: linux
            asset_arch: arm64
            runner: ubuntu-24.04-arm
          - asset_os: linux
            asset_arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify tag version
        run: |
          expected="v$(./build/fs-lint --version | awk '{print $2}')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            printf '::error::Release tag %s does not match compiled version %s. Update CMakeLists.txt before tagging.\n' "$GITHUB_REF_NAME" "$expected"
            exit 1
          fi
      - name: Package
        id: package
        run: |
          package="fs-lint-${{ matrix.asset_os }}-${{ matrix.asset_arch }}"
          mkdir release
          cp build/fs-lint "release/$package"
          "release/$package" --version
          cd release
          cmake -E sha256sum "$package" > "$package.sha256"
          echo "name=$package" >> "$GITHUB_OUTPUT"
      - name: Attest binary
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: release/${{ steps.package.outputs.name }}
      - name: Prepare release attestation
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: cp "$BUNDLE_PATH" "release/$PACKAGE_NAME.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - build
      - source
      - homebrew-template
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --generate-notes
          --title "fs-lint $GITHUB_REF_NAME"

  homebrew:
    name: Open Homebrew tap PR
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    needs:
      - publish
      - homebrew-template
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPOSITORY: yowainwright/homebrew-tap
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require tap token
        run: test -n "$GH_TOKEN"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify published release
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          ref: ${{ needs.homebrew-template.outputs.tap-sha }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update formula
        run: scripts/release.sh homebrew-pr homebrew-tap "$RELEASE_TAG"
