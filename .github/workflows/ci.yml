name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.system }} / ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            compiler: GCC
            runner: ubuntu-latest
            cc: gcc
          - system: Linux
            compiler: Clang
            runner: ubuntu-latest
            cc: clang
          - system: macOS
            compiler: Clang
            runner: macos-latest
            cc: clang
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build --parallel
      - name: Test binary, library, and install
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Linux / ASan + UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      CC: clang
      SANITIZER_C_FLAGS: >-
        -Werror
        -fsanitize=address,undefined
        -fno-omit-frame-pointer
      SANITIZER_LINKER_FLAGS: -fsanitize=address,undefined
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=${SANITIZER_C_FLAGS}"
          "-DCMAKE_EXE_LINKER_FLAGS=${SANITIZER_LINKER_FLAGS}"
      - name: Build
        run: cmake --build build-sanitized --parallel
      - name: Test
        run: >-
          ctest --test-dir build-sanitized --output-on-failure
          --exclude-regex '^e2e-install$'

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18
      - run: >-
          clang-format-18 --dry-run --Werror
          include/*.h src/*.c src/*.h tests/*.c

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy-18
      - name: Configure compilation database
        run: >-
          cmake -S . -B build-lint
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Lint C sources and headers
        run: clang-tidy-18 -p build-lint src/*.c tests/*.c

  shell:
    name: Shell format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
          mkdir -p build-shell-tools
          archive=build-shell-tools/shellcheck-legibility-0.2.1.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/yowainwright/shellcheck_legibility/releases/download/v0.2.1/shellcheck-legibility-0.2.1.tar.gz \
            --output "$archive"
          echo "137942db1000e72ce8f8e2fbe8c10e334c70dc554ad2ef08aa49f0778f0302c0  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C build-shell-tools
          echo "$PWD/build-shell-tools/shellcheck-legibility-0.2.1/bin" >> "$GITHUB_PATH"
      - name: Check shell scripts
        run: ./scripts/setup.sh shell-check
